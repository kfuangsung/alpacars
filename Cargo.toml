[package]
name = "alpacars"
version = "0.5.0"
edition = "2021"
rust-version = "1.88"
description = "Async Rust SDK for Alpaca Markets API"
license = "MIT OR Apache-2.0"
authors = ["Kachain Fuangsung <kachain.f@outlook.com>"]
repository = "https://github.com/kfuangsung/alpacars"
homepage = "https://github.com/kfuangsung/alpacars"
documentation = "https://docs.rs/alpacars"
readme = "README.md"
keywords = ["alpaca", "trading", "api", "async", "sdk"]
categories = ["api-bindings", "asynchronous", "network-programming"]

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
url = "2"
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"
rmp-serde = "1"
tracing = "0.1"

[dev-dependencies]
wiremock = "0.6"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
