name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# On a PR branch, a rapid second push supersedes the first, so cancelling the
# in-flight run saves a runner nobody was going to look at.
#
# On main it is the opposite: every commit must end up with its own verdict.
# Two merges in quick succession would otherwise cancel the first commit's run,
# leaving it permanently unverified and displaying a red ✗ that reads as a
# failure — which is exactly what happened to 1c2b1d9.
#
# Deliberately not applied to release.yml at all.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

  test:
    # tokio-tungstenite uses native-tls, which is a different backend per OS
    # (OpenSSL / Security.framework / SChannel), so this axis is worth covering.
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build (lib, bins, examples, tests)
        run: cargo build --all-targets --locked
      - name: Test
        run: cargo test --locked

  docs:
    # Catches what would otherwise only surface as a failed docs.rs build
    # after the version is already published and irreversible.
    name: Docs
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build documentation
        run: cargo doc --no-deps --locked

  package:
    # Building from the packaged tarball is a different code path from a normal
    # build (excluded files, path deps, .gitignore interactions). Fail here at
    # PR time rather than mid-release.
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Verify the crate packages and builds
        run: cargo publish --dry-run --locked

  semver:
    # Compares the PR's public API against the latest crates.io release and
    # fails if it breaks without an adequate version bump. Understands pre-1.0
    # rules, so 0.4.x -> 0.5.0 with breaking changes passes, while a break at
    # an unchanged version does not.
    #
    # PRs only: on a push to main the merge has already happened, so there is
    # nothing left to gate.
    name: Semver
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: obi1kenobi/cargo-semver-checks-action@v2

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@v2
      - name: Build on MSRV
        run: cargo build --all-targets --locked
      - name: Test on MSRV
        run: cargo test --locked
